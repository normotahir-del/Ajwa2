<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>AJWA Reception</title>
<style>
body{margin:0;background:#f7f4ed;color:#18241f;font-family:Inter,system-ui,sans-serif}header{background:#173f32;color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}.logo{font:bold 24px Georgia;color:#f0d58e}.live{font-size:13px;color:#dcebe3}.wrap{max-width:1100px;margin:auto;padding:30px 20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:25px}.stat{background:white;border-radius:16px;padding:18px;box-shadow:0 5px 20px #183f3210}.stat b{display:block;font-size:25px;color:#173f32}.orders{display:grid;gap:14px}.order{background:white;border-radius:18px;padding:18px;border:1px solid #e7dece}.top{display:flex;justify-content:space-between;gap:10px}.num{font-weight:900;color:#173f32}.status{border-radius:999px;padding:6px 10px;font-size:12px;font-weight:900}.NEW{background:#fff0c9;color:#85621b}.PREPARING{background:#dcecff;color:#245a8a}.READY{background:#dff4df;color:#2d7130}.COMPLETED{background:#e6e7e5;color:#58605a}.items{padding:12px 0;color:#60665f}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{border:0;padding:9px 12px;border-radius:9px;font-weight:800;background:#eee5d4;color:#173f32}.empty{text-align:center;padding:60px;color:#737871}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}}
</style></head><body>
<header><div class="logo">AJWA Reception</div><div class="live">● Live order desk</div></header><div class="wrap">
<div class="stats"><div class="stat"><b id="new">0</b>New</div><div class="stat"><b id="prep">0</b>Preparing</div><div class="stat"><b id="ready">0</b>Ready</div><div class="stat"><b id="sales">₹0</b>Sales</div></div>
<div id="orders" class="orders"></div></div>
<script>
let previousNew=0;
async function load(){const data=await (await fetch("/api/orders")).json();document.getElementById("new").textContent=data.filter(x=>x.status==="NEW").length;document.getElementById("prep").textContent=data.filter(x=>x.status==="PREPARING").length;document.getElementById("ready").textContent=data.filter(x=>x.status==="READY").length;document.getElementById("sales").textContent="₹"+data.reduce((s,x)=>s+(Number(x.total)||0),0);
if(data.filter(x=>x.status==="NEW").length>previousNew&&previousNew!==0) new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAESsAAABAAgAZGF0YQAAAAA=").play().catch(()=>{});previousNew=data.filter(x=>x.status==="NEW").length;
document.getElementById("orders").innerHTML=data.length?data.map(o=>`<div class="order"><div class="top"><div><span class="num">#${o.orderNumber}</span> · ${o.customer}<br><small>${o.phone} · ${o.type}</small></div><span class="status ${o.status}">${o.status}</span></div><div class="items">${o.items.map(i=>`${i.name} × ${i.qty} — ₹${i.price*i.qty}`).join("<br>")}<br><b>Total ₹${o.total}</b><br><small>${o.address||""}</small></div><div class="actions">${o.status==="NEW"?'<button onclick="setStatus('+o.id+',\\'PREPARING\\')">Accept & Prepare</button>':''}${o.status==="PREPARING"?'<button onclick="setStatus('+o.id+',\\'READY\\')">Mark Ready</button>':''}${o.status==="READY"?'<button onclick="setStatus('+o.id+',\\'COMPLETED\\')">Complete Order</button>':''}</div></div>`).join(""):'<div class="empty">No orders yet.</div>'}
async function setStatus(id,status){await fetch("/api/orders/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status})});load()}load();setInterval(load,4000);
</script></body></html>
